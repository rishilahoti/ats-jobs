name: release
# Push a tag like v0.1.3 (see "Releasing" in the README): tests, stages the release on npm,
# and creates a draft GitHub release. Neither release goes live before maintainer approval.
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (no token stored) + provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.5
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --draft --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Next step
        run: |
          echo "Staged $GITHUB_REF_NAME and created its draft GitHub release." >> "$GITHUB_STEP_SUMMARY"
          echo "1. Run: npm stage list ats-jobs" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Approve the correct stage: npm stage approve STAGE_ID_FROM_LIST" >> "$GITHUB_STEP_SUMMARY"
          echo "3. After npm confirms publication, run: gh release edit $GITHUB_REF_NAME --draft=false --latest" >> "$GITHUB_STEP_SUMMARY"
